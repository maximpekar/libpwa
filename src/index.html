<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="./img/favicon/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library</title>
		<link rel="icon" type="image/png" href="./img/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="./img/favicon/favicon.svg" />
		<link rel="shortcut icon" href="./img/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="MyWebSite" />
		<link rel="manifest" href="site.webmanifest" />
	</head>
	<body>

		<div class="container">
			<div class="row">
					<h3 class="text-center display-9" id="findType">Поиск книг</h3>
			</div>
			<div class="row mb-1">
				<div class="col-5 px-1">
					<input id="bookAuthor" type="text" placeholder="Автор" class="form-control">
				</div>
				<div class="col-5 px-1">
					<input id="bookName" type="text" placeholder="Название" class="form-control">
				</div>
				<div class="col-2 px-1">
					<button class="btn btn-primary" id="btnSearch"><i class="bi bi-search"></i></button>
				</div>
			</div>

			<div class="row mb-1">
				<div class="col-12" id="divResult"></div>
			</div>
		</div>

		<script type="module" src="./js/main.js"></script>
	</body>
</html>
